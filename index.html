<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="靜態旅遊行程規劃工具：每日行程、預算與行李清單，資料存在瀏覽器中。">
  <title>旅程手帖</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header no-print">
    <a href="#/" class="logo"><span aria-hidden="true">🧭</span> 旅程手帖</a>
    <div class="header-actions">
      <span id="sync-status" class="sync-status" hidden></span>
      <button id="login-btn" class="btn btn-line" data-action="line-login" hidden>LINE 登入同步</button>
      <button class="btn btn-ghost" data-action="import">匯入</button>
      <button class="btn btn-ghost" data-action="export-all">匯出全部</button>
      <button class="btn btn-primary" data-action="new-trip">＋ 新增旅程</button>
    </div>
  </header>

  <main id="app" class="container"></main>

  <footer id="site-footer" class="site-footer no-print">
    資料只儲存在這個瀏覽器（localStorage），換裝置前請先「匯出全部」備份。
  </footer>

  <!-- 旅程表單 -->
  <dialog id="trip-dialog">
    <form id="trip-form" class="form">
      <h2 id="trip-dialog-title">新增旅程</h2>
      <label>旅程名稱<input name="name" required maxlength="60" placeholder="例如：京都賞楓之旅"></label>
      <label>目的地<input name="destination" maxlength="60" placeholder="例如：日本京都"></label>
      <div class="form-row">
        <label>出發日期<input type="date" name="startDate" required></label>
        <label>回程日期<input type="date" name="endDate" required></label>
      </div>
      <div class="form-row">
        <label>總預算<input type="number" name="budget" min="0" step="any" placeholder="0"></label>
        <label>幣別
          <select name="currency"></select>
        </label>
      </div>
      <label>備註<textarea name="notes" rows="3" maxlength="500" placeholder="訂房資訊、航班編號、同行旅伴……"></textarea></label>
      <div class="form-actions">
        <button type="button" class="btn" data-action="close-dialog">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </dialog>

  <!-- 行程項目表單 -->
  <dialog id="activity-dialog">
    <form id="activity-form" class="form">
      <h2 id="activity-dialog-title">新增行程</h2>
      <label>標題<input name="title" required maxlength="100" placeholder="例如：清水寺"></label>
      <label>日期<select name="date" required></select></label>
      <fieldset class="travel-fields">
        <legend>從上一站過來（選填）</legend>
        <div class="form-row form-row-3">
          <label>移動方式<select name="travelMode"></select></label>
          <label>移動時間（分）<input type="number" name="travelMin" min="0" max="1440" step="1" inputmode="numeric" placeholder="15"></label>
          <label>車資
            <span class="fare-input">
              <input type="number" name="travelCost" min="0" step="any" inputmode="decimal" placeholder="0">
              <select name="travelCostCurrency" aria-label="車資幣別">
                <option value="JPY">¥ 日幣</option>
                <option value="TWD">NT$ 台幣</option>
              </select>
            </span>
          </label>
        </div>
        <p id="fare-hint" class="form-hint muted"></p>
      </fieldset>
      <div class="form-row">
        <label>開始時間<input type="time" name="time"></label>
        <label>結束時間<input type="time" name="endTime"></label>
      </div>
      <p class="form-hint muted">填了移動時間，開始時間會自動帶入「上一站結束＋移動時間」</p>
      <div class="form-row">
        <label>類別<select name="category"></select></label>
        <label><span id="cost-label">花費</span><input type="number" name="cost" min="0" step="any" placeholder="0"></label>
      </div>
      <label>地點<input name="location" maxlength="200" placeholder="地名或地址，填寫後可直接用 Google 地圖導航"></label>
      <label>Google 地圖連結（選填）<input name="mapUrl" type="url" maxlength="500" inputmode="url" placeholder="在 Google 地圖按「分享」→ 複製連結，貼在這裡"></label>
      <label>備註<textarea name="notes" rows="3" maxlength="500" placeholder="門票、營業時間、交通方式……"></textarea></label>
      <div class="form-actions">
        <button type="button" class="btn" data-action="close-dialog">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </dialog>

  <!-- 購物清單表單 -->
  <dialog id="shop-dialog">
    <form id="shop-form" class="form">
      <h2 id="shop-dialog-title">新增要買的東西</h2>
      <label>要買什麼<input name="text" required maxlength="200" placeholder="例如：抹茶粉"></label>
      <p id="shop-multi-hint" class="form-hint muted">一次加好幾樣可以用「、」分開，例如：抹茶粉、八橋</p>
      <label>哪一天買<select name="date"></select></label>
      <label>在哪一站買<select name="activityId"></select></label>
      <label><span id="shop-price-label">預估金額</span><input type="number" name="price" min="0" step="any" inputmode="decimal" placeholder="0"></label>
      <p class="form-hint muted">金額會計入預算的「購物」；一次加好幾樣時，每一樣都是這個金額</p>
      <p class="form-hint muted">指定行程後，行程改到別天，這樣東西也會跟著走</p>
      <div class="form-actions">
        <button type="button" class="btn" data-action="close-dialog">取消</button>
        <button type="submit" class="btn btn-primary">儲存</button>
      </div>
    </form>
  </dialog>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/line.js"></script>
</body>
</html>
